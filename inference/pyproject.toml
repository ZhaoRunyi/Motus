[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motus-client"
version = "0.1.0"
description = "Minimal websocket client package for Motus challenge deployment."
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.1.0",
    "numpy>=1.24.0",
    "opencv-python==4.11.0.86",
    "websockets>=11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["challenge_deploy*"]
