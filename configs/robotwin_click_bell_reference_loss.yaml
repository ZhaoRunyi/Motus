training_mode: "finetune"

common:
  action_dim: 14
  state_dim: 14

  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "robotwin"
  dataset_dir: "/workspace/data/motus_robotwin2_click_bell_preprocessed"
  data_mode: "clean"
  task_mode: "single"
  task_name: "click_bell"
  max_episodes: null
  image_aug: false

model:
  # WAN Video Model settings
  wan:
    config_path: "/workspace/ckpts/Wan2.2-TI2V-5B"
    checkpoint_path: "/workspace/ckpts/Wan2.2-TI2V-5B"
    vae_path: "/workspace/ckpts/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/workspace/ckpts/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

# Training configuration
training:
  batch_size: 8
  max_steps: 20000
  learning_rate: 5.0e-5
  weight_decay: 0.01

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

# System settings
system:
  checkpoint_dir: "./checkpoints_robotwin"
  log_level: "INFO"
  log_interval: 1
  save_interval: 5000
  val_interval: 5000
  num_workers: 4
  pin_memory: true

logging:
  report_to: "all"
  wandb_project: "motus"
  
  # TensorBoard settings
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "robotwin_click_bell_reference_loss_14d"

resume:
  checkpoint_path: null

finetune:
  checkpoint_path: "/workspace/ckpts/Motus"
