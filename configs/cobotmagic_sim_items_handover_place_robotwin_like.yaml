training_mode: "finetune"

common:
  action_dim: 14
  state_dim: 14

  # Match the RobotWin temporal/action layout used by Motus stage-3 configs.
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2

dataset:
  type: "lerobot"
  max_episodes: null
  image_aug: false
  task_mode: "single"
  task_name: null

  params:
    repo_id: "embodichain_sim_data/Motus_cobotmagic_Sim_items_handover_place"
    root: "/aoss/data/embodichain_sim_data/Motus_cobotmagic_Sim_items_handover_place"
    embodiment_type: "cobotmagic_sim_items_handover_place_14d"

    # Sim data is already 14d joint+gripper state/action, so do not set
    # state_action_space here. LeRobotMotusDataset will use the vectors as-is.
    enable_t5_fallback: false
    t5_wan_path: "/workspace/ckpts"
    t5_folder_name: "t5_embedding"
    t5_text_len: 512
    video_backend: "pyav"

model:
  wan:
    config_path: "/workspace/ckpts/Wan2.2-TI2V-5B"
    checkpoint_path: "/workspace/ckpts/Wan2.2-TI2V-5B"
    vae_path: "/workspace/ckpts/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/workspace/ckpts/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 8
  max_steps: 20000
  learning_rate: 5.0e-5
  weight_decay: 0.01

  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4

  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints_piper"
  log_level: "INFO"
  log_interval: 1
  save_interval: 10000
  newest_save_interval: 2000
  val_interval: 500
  num_workers: 16
  pin_memory: true

logging:
  report_to: "wandb"
  wandb_project: "motus-piper"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "cobotmagic_sim_items_handover_place_robotwin_like_14d"

resume:
  checkpoint_path: null

finetune:
  checkpoint_path: "/workspace/ckpts/Motus"
